[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/server/Dockerfile"
watchPatterns = ["apps/server/**", "packages/shared/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
preDeployCommand = ["pnpm --filter @tpv/server db:migrate"]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
